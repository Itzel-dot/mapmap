<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카카오맵 장소 검색</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    .sidebar {
      width: 35%;
      min-width: 320px;
      padding: 20px;
      border-right: 1px solid #ddd;
      overflow-y: auto;
    }

    .map-area {
      width: 65%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    h2 { margin-top: 0; }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    #keywordInput {
      flex: 1;
      padding: 10px;
      font-size: 14px;
    }

    #searchButton {
      padding: 10px 14px;
      border: none;
      background-color: #fee500;
      font-weight: bold;
      cursor: pointer;
    }

    #resultList {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .result-item {
      padding: 12px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .result-item:hover {
      background-color: #f5f5f5;
    }

    .place-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .place-address {
      font-size: 13px;
      color: #666;
    }

    .message {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">
    <aside class="sidebar">
      <h2>장소 검색</h2>

      <div class="search-box">
        <input
          type="text"
          id="keywordInput"
          placeholder="예: 세계 음식 거리, 관광명소, 카페"
        />
        <button id="searchButton">검색</button>
      </div>

      <p class="message" id="statusText">지도를 불러오는 중...</p>
      <ul id="resultList"></ul>
    </aside>

    <main class="map-area">
      <div id="map"></div>
    </main>
  </div>

  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=cc993a9c18fd04ad2861239d0357c8c4&libraries=services&autoload=false">
  </script>

  <script>
    let map;
    let places;
    let infoWindow;
    let currentMarker;
    let markers = [];

    let currentPosition;

    const defaultPosition = {
      lat: 37.5665,
      lng: 126.9780
    };

    const keywordInput = document.getElementById("keywordInput");
    const searchButton = document.getElementById("searchButton");
    const resultList = document.getElementById("resultList");
    const statusText = document.getElementById("statusText");

    // 페이지와 SDK가 완전히 준비된 후 실행
    window.addEventListener("load", function () {
      if (typeof kakao === "undefined" || !kakao.maps) {
        alert("카카오맵 SDK를 불러오지 못했습니다.");
        statusText.textContent = "지도 로딩에 실패했습니다.";
        return;
      }

      kakao.maps.load(function () {
        loadCurrentLocation();
      });
    });

    // 현재 위치 권한 요청 및 위치 불러오기
    function loadCurrentLocation() {
      statusText.textContent = "현재 위치 권한을 요청하는 중입니다...";

      if (!navigator.geolocation) {
        currentPosition = defaultPosition;
        createMap(currentPosition);
        statusText.textContent = "브라우저가 위치 기능을 지원하지 않아 서울 기준으로 표시했습니다.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (position) {
          currentPosition = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };

          createMap(currentPosition);
          statusText.textContent = "현재 위치를 중심으로 지도를 표시했습니다.";
        },

        function (error) {
          currentPosition = defaultPosition;
          createMap(currentPosition);

          if (error.code === error.PERMISSION_DENIED) {
            statusText.textContent = "위치 권한이 거부되어 서울 기준으로 표시했습니다.";
          } else {
            statusText.textContent = "현재 위치를 가져오지 못해 서울 기준으로 표시했습니다.";
          }
        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    // 지도 생성
    function createMap(position) {
      const mapContainer = document.getElementById("map");

      const mapOption = {
        center: new kakao.maps.LatLng(position.lat, position.lng),
        level: 5
      };

      map = new kakao.maps.Map(mapContainer, mapOption);
      places = new kakao.maps.services.Places();

      infoWindow = new kakao.maps.InfoWindow({
        zIndex: 1
      });

      addCurrentMarker(position);

      // 지도 크기 재계산
      setTimeout(function () {
        map.relayout();
        map.setCenter(new kakao.maps.LatLng(position.lat, position.lng));
      }, 300);
    }

    // 현재 위치 마커 표시
    function addCurrentMarker(position) {
      const markerPosition = new kakao.maps.LatLng(position.lat, position.lng);

      currentMarker = new kakao.maps.Marker({
        map: map,
        position: markerPosition
      });

      infoWindow.setContent(
        '<div style="padding:6px;font-size:13px;">현재 위치</div>'
      );

      infoWindow.open(map, currentMarker);
    }

    searchButton.addEventListener("click", searchPlaces);

    keywordInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        searchPlaces();
      }
    });

    // 장소 검색
    function searchPlaces() {
      const keyword = keywordInput.value.trim();

      if (!keyword) {
        alert("검색어를 입력해주세요.");
        return;
      }

      if (!map || !places || !currentPosition) {
        alert("지도가 아직 준비되지 않았습니다.");
        return;
      }

      statusText.textContent = "검색 중입니다...";

      places.keywordSearch(keyword, placesSearchCallback, {
        location: new kakao.maps.LatLng(
          currentPosition.lat,
          currentPosition.lng
        )
      });
    }

    // 검색 결과 처리
    function placesSearchCallback(data, status) {
      if (status === kakao.maps.services.Status.OK) {
        removeSearchMarkers();
        resultList.innerHTML = "";
        displayPlaces(data);
        statusText.textContent = `검색 결과 ${data.length}개를 찾았습니다.`;
      } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
        removeSearchMarkers();
        resultList.innerHTML = "";
        alert("검색 결과가 없습니다.");
        statusText.textContent = "검색 결과가 없습니다.";
      } else {
        alert("검색 중 오류가 발생했습니다.");
        statusText.textContent = "검색 중 오류가 발생했습니다.";
      }
    }

    // 검색 결과 표시
    function displayPlaces(placeData) {
      const bounds = new kakao.maps.LatLngBounds();

      placeData.forEach(function (place) {
        const placePosition = new kakao.maps.LatLng(place.y, place.x);

        const marker = new kakao.maps.Marker({
          map: map,
          position: placePosition
        });

        markers.push(marker);
        bounds.extend(placePosition);

        const listItem = document.createElement("li");
        listItem.className = "result-item";

        listItem.innerHTML = `
          <div class="place-name">${place.place_name}</div>
          <div class="place-address">
            ${place.road_address_name || place.address_name}
          </div>
        `;

        listItem.addEventListener("click", function () {
          map.panTo(placePosition);
          showInfoWindow(marker, place.place_name);
        });

        kakao.maps.event.addListener(marker, "click", function () {
          showInfoWindow(marker, place.place_name);
        });

        resultList.appendChild(listItem);
      });

      map.setBounds(bounds);
    }

    function showInfoWindow(marker, placeName) {
      const content = `
        <div style="padding:6px;font-size:13px;">
          ${placeName}
        </div>
      `;

      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }

    // 검색 마커만 제거
    function removeSearchMarkers() {
      markers.forEach(function (marker) {
        marker.setMap(null);
      });

      markers = [];
    }
  </script>
</body>
</html>
