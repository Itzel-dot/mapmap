<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한국 속 세계 문화 지도</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    .sidebar {
      width: 35%;
      min-width: 330px;
      padding: 18px;
      border-right: 1px solid #ddd;
      overflow-y: auto;
      background: #fafafa;
    }

    .map-area {
      width: 65%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #map {
      width: 100%;
      height: 70%;
    }

    #roadview {
      width: 100%;
      height: 30%;
      border-top: 1px solid #ddd;
    }

    h2 {
      margin-top: 0;
    }

    .summary {
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }

    .tab-buttons {
      display: flex;
      gap: 8px;
      margin: 14px 0;
    }

    .tab-button {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      background: white;
      cursor: pointer;
      font-weight: bold;
      border-radius: 8px;
    }

    .tab-button.active {
      background: #fee500;
      border-color: #e0c900;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    #keywordInput {
      flex: 1;
      padding: 10px;
      font-size: 14px;
    }

    #searchButton {
      padding: 10px 14px;
      border: none;
      background-color: #333;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
    }

    #categoryButton {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: none;
      background: #4b7bec;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
    }

    #resultList {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .result-item {
      padding: 12px;
      border-bottom: 1px solid #e5e5e5;
      cursor: pointer;
      background: white;
    }

    .result-item:hover {
      background-color: #f1f1f1;
    }

    .place-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .place-address {
      font-size: 13px;
      color: #666;
    }

    .message {
      color: #666;
      font-size: 14px;
      margin: 10px 0;
    }
  </style>
</head>

<body>
  <div class="container">
    <aside class="sidebar">
      <h2>🌍 한국 속 세계 문화 지도</h2>

      <p class="summary">
        한국 안에서 다양한 세계 음식 거리와 국제 문화 명소를 한눈에 볼 수 있는 지도입니다.
      </p>

      <div class="tab-buttons">
        <button class="tab-button active" id="foodTab">세계 음식 거리</button>
        <button class="tab-button" id="cultureTab">국제 문화 명소</button>
      </div>

      <button id="categoryButton">현재 탭 장소 보기</button>

      <div class="search-box">
        <input
          type="text"
          id="keywordInput"
          placeholder="예: 이태원 세계음식거리"
        />
        <button id="searchButton">검색</button>
      </div>

      <p class="message" id="statusText">지도를 불러오는 중...</p>
      <ul id="resultList"></ul>
    </aside>

    <main class="map-area">
      <div id="map"></div>
      <div id="roadview"></div>
    </main>
  </div>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=cc993a9c18fd04ad2861239d0357c8c4&libraries=services&autoload=false"></script>

  <script>
    let map;
    let places;
    let infoWindow;
    let roadview;
    let roadviewClient;
    let currentPosition;
    let currentMarker;
    let markers = [];
    let activeTab = "food";

    const defaultPosition = {
      lat: 37.5665,
      lng: 126.9780
    };

    const tabData = {
      food: {
        name: "세계 음식 거리",
        categoryCode: "FD6",
        places: [
          "이태원 세계음식거리",
          "안산 다문화음식거리",
          "인천 차이나타운"
        ]
      },
      culture: {
        name: "국제 문화 명소",
        categoryCode: "AT4",
        places: [
          "국립중앙박물관",
          "서울중앙성원",
          "부산 UN기념공원"
        ]
      }
    };

    const foodTab = document.getElementById("foodTab");
    const cultureTab = document.getElementById("cultureTab");
    const keywordInput = document.getElementById("keywordInput");
    const searchButton = document.getElementById("searchButton");
    const categoryButton = document.getElementById("categoryButton");
    const resultList = document.getElementById("resultList");
    const statusText = document.getElementById("statusText");

    window.addEventListener("load", function () {
      kakao.maps.load(function () {
        loadCurrentLocation();
      });
    });

    function loadCurrentLocation() {
      statusText.textContent = "현재 위치 권한을 요청하는 중입니다...";

      if (!navigator.geolocation) {
        currentPosition = defaultPosition;
        createMap(currentPosition);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (position) {
          currentPosition = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };

          createMap(currentPosition);
          statusText.textContent = "현재 위치를 중심으로 지도를 표시했습니다.";
        },

        function () {
          currentPosition = defaultPosition;
          createMap(currentPosition);
          statusText.textContent = "현재 위치를 가져오지 못해 서울 기준으로 표시했습니다.";
        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    function createMap(position) {
      const mapContainer = document.getElementById("map");

      map = new kakao.maps.Map(mapContainer, {
        center: new kakao.maps.LatLng(position.lat, position.lng),
        level: 5
      });

      places = new kakao.maps.services.Places();
      infoWindow = new kakao.maps.InfoWindow({ zIndex: 1 });

      roadview = new kakao.maps.Roadview(document.getElementById("roadview"));
      roadviewClient = new kakao.maps.RoadviewClient();

      addCurrentMarker(position);

      setTimeout(function () {
        map.relayout();
        map.setCenter(new kakao.maps.LatLng(position.lat, position.lng));
      }, 300);
    }

    function addCurrentMarker(position) {
      const markerPosition = new kakao.maps.LatLng(position.lat, position.lng);

      currentMarker = new kakao.maps.Marker({
        map: map,
        position: markerPosition
      });

      infoWindow.setContent('<div style="padding:6px;font-size:13px;">현재 위치</div>');
      infoWindow.open(map, currentMarker);
    }

    foodTab.addEventListener("click", function () {
      activeTab = "food";
      foodTab.classList.add("active");
      cultureTab.classList.remove("active");
      statusText.textContent = "세계 음식 거리 탭을 선택했습니다.";
    });

    cultureTab.addEventListener("click", function () {
      activeTab = "culture";
      cultureTab.classList.add("active");
      foodTab.classList.remove("active");
      statusText.textContent = "국제 문화 명소 탭을 선택했습니다.";
    });

    categoryButton.addEventListener("click", function () {
      showTabPlaces();
    });

    searchButton.addEventListener("click", function () {
      searchByKeyword(keywordInput.value.trim());
    });

    keywordInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        searchByKeyword(keywordInput.value.trim());
      }
    });

    function showTabPlaces() {
      if (!map || !places) {
        alert("지도가 아직 준비되지 않았습니다.");
        return;
      }

      removeSearchMarkers();
      resultList.innerHTML = "";

      const selectedPlaces = tabData[activeTab].places;
      statusText.textContent = `${tabData[activeTab].name} 장소를 불러오는 중입니다...`;

      selectedPlaces.forEach(function (keyword) {
        searchByKeyword(keyword, true);
      });
    }

    function searchByKeyword(keyword, isTabSearch = false) {
      if (!keyword) {
        alert("검색어를 입력해주세요.");
        return;
      }

      if (!map || !places) {
        alert("지도가 아직 준비되지 않았습니다.");
        return;
      }

      if (!isTabSearch) {
        removeSearchMarkers();
        resultList.innerHTML = "";
        statusText.textContent = "검색 중입니다...";
      }

      places.keywordSearch(keyword, function (data, status) {
        if (status === kakao.maps.services.Status.OK) {
          displayPlace(data[0]);

          if (!isTabSearch) {
            statusText.textContent = `"${keyword}" 검색 결과를 표시했습니다.`;
          } else {
            statusText.textContent = `${tabData[activeTab].name} 장소를 표시했습니다.`;
          }
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
          if (!isTabSearch) {
            alert("검색 결과가 없습니다.");
            statusText.textContent = "검색 결과가 없습니다.";
          }
        } else {
          if (!isTabSearch) {
            alert("검색 중 오류가 발생했습니다.");
            statusText.textContent = "검색 중 오류가 발생했습니다.";
          }
        }
      });
    }

    function displayPlace(place) {
      const placePosition = new kakao.maps.LatLng(place.y, place.x);

      const marker = new kakao.maps.Marker({
        map: map,
        position: placePosition
      });

      markers.push(marker);

      const listItem = document.createElement("li");
      listItem.className = "result-item";

      listItem.innerHTML = `
        <div class="place-name">${place.place_name}</div>
        <div class="place-address">${place.road_address_name || place.address_name}</div>
      `;

      listItem.addEventListener("click", function () {
        moveToPlace(marker, placePosition, place.place_name);
      });

      kakao.maps.event.addListener(marker, "click", function () {
        moveToPlace(marker, placePosition, place.place_name);
      });

      resultList.appendChild(listItem);

      map.setCenter(placePosition);
    }

    function moveToPlace(marker, position, placeName) {
      map.panTo(position);

      infoWindow.setContent(
        `<div style="padding:6px;font-size:13px;">${placeName}</div>`
      );

      infoWindow.open(map, marker);
      showRoadview(position);
    }

    function showRoadview(position) {
      roadviewClient.getNearestPanoId(position, 50, function (panoId) {
        if (panoId) {
          roadview.setPanoId(panoId, position);
        } else {
          statusText.textContent = "이 장소 주변에는 로드뷰가 없습니다.";
        }
      });
    }

    function removeSearchMarkers() {
      markers.forEach(function (marker) {
        marker.setMap(null);
      });

      markers = [];
    }
  </script>
</body>
</html>
